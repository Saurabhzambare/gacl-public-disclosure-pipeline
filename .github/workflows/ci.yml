name: Local pipeline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[cloud]"
      - name: Test without cloud credentials
        run: python -m unittest discover -s tests -v
      - name: Run reviewed-data pipeline without website access
        run: python -m gacl_pipeline --from-examples

